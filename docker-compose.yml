services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend_proj_ext_quatro
    networks:
      - backend
    tty: true
    init: true
    depends_on:
      database:
        condition: service_healthy
        restart: true
    volumes:
      - .:/app

  database:
    image: mysql:8.4.2
    container_name: db_proj_ext_quatro
    environment:
      MYSQL_DATABASE: "${MYSQL_DATABASE}"
      MYSQL_USER: "${MYSQL_USER}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
    ports:
      - '3306:3306'
    volumes:
      - mysql-volume:/var/lib/mysql
    restart: always
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${MYSQL_USER}", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    networks:
      - backend

volumes:
  mysql-volume:
    driver: local