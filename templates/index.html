{% extends "components/layout.html" %}

{% block content %}

      <div class="mx-auto" style="max-width:1400px">
        <div class="page-header">
          <div>
            <h1 class="page-title">Painel</h1>
            <p class="page-desc"></p>
          </div>
        </div>
        <div class="stats-grid mb-3">
          <div class="panel stat-card">
            <div class="panel-body">
              <div class="stat-icon tone-primary"><i class="bi bi-clock"></i></div>
              <p class="stat-value"></p>
              <p class="stat-label">Turmas hoje</p>
            </div>
          </div>
          <div class="panel stat-card">
            <div class="panel-body">
              <div class="stat-icon tone-teal"><i class="bi bi-buildings"></i></div>
              <p class="stat-value"></p>
              <p class="stat-label">Salas em uso hoje</p>
            </div>
          </div>
          <div class="panel stat-card">
            <div class="panel-body">
              <div class="stat-icon tone-danger"><i class="bi bi-exclamation-triangle"></i></div>
              <p class="stat-value"></p>
              <p class="stat-label">Turmas em conflito</p>
            </div>
          </div>
          <div class="panel stat-card">
            <div class="panel-body">
              <div class="stat-icon tone-violet"><i class="bi bi-people"></i></div>
              <p class="stat-value"></p>
              <p class="stat-label">Professores ativos</p>
            </div>
          </div>
        </div>

        {% include "components/calendario.html" %}
        
        <div class="row g-3 align-items-start">
          <div class="col-12 col-lg-7">
            <div class="panel">
              <div class="panel-body panel-body-tight">
                <div class="d-flex align-items-center justify-content-between gap-2 mb-2">
                  <h2 class="panel-title mb-0">Próximas aulas de hoje</h2>
                  <a class="btn btn-link btn-sm" href="hoje.html">Ver agenda <i class="bi bi-chevron-right"></i></a>
                </div>
                <div class="d-flex flex-column gap-2">
                </div>
              </div>
            </div>
          </div>
          <div class="col-12 col-lg-5">
            <div class="panel">
              <div class="panel-body panel-body-tight">
                <h2 class="panel-title">Conflitos para revisar</h2>
                <a class="btn btn-outline-secondary btn-sm w-100 mt-3" href="cadastro.html#turmas">
                  <i class="bi bi-plus-lg"></i> Cadastrar nova turma
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>

{% endblock %}
