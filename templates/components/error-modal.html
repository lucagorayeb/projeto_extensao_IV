<div class="modal fade" id="error-modal" tabindex="-1" aria-labelledby="error-modal-title" aria-describedby="error-modal-description" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title fs-4" id="error-modal-title"><i class="bi bi-exclamation-circle text-destructive me-2" aria-hidden="true"></i><span data-error-title>Não foi possível concluir</span></h2>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
            </div>
            <div class="modal-body">
                <p class="text-break mb-0" id="error-modal-description" data-error-message role="alert"></p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary" data-bs-dismiss="modal" data-error-close>Entendi</button>
            </div>
        </div>
    </div>
</div>
