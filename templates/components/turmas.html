<div class="cadastro-layout">
    <div class="cadastro-form-col">
        <div class="panel">
        <div class="panel-body">
            <h2 class="panel-title">Nova turma</h2>
            <form class="form-stack" data-demo-form data-success="Turma cadastrada.">
            <div class="form-grid-2">
                <div class="form-field">
                <label for="turma-curso">Curso</label>
                <input id="turma-curso" class="form-control" type="text" placeholder="Ex.: Eng. Software" required>
                </div>
                <div class="form-field">
                <label for="turma-periodo">Período / turma</label>
                <input id="turma-periodo" class="form-control" type="text" placeholder="Ex.: 4º ou 2º B">
                </div>
            </div>
            <div class="form-field">
                <label for="turma-disciplina">Disciplina</label>
                <input id="turma-disciplina" class="form-control" type="text"
                placeholder="Ex.: Algoritmos e Estrutura de Dados II" required>
            </div>
            <div class="form-field">
                <label for="turma-professor">Professor responsável</label>
                <select id="turma-professor" class="form-select" required>
                <option value="" selected disabled>Selecione…</option>
                </select>
            </div>
            <div class="form-grid-2">
                <div class="form-field">
                <label for="turma-dia">Dia da semana</label>
                <select id="turma-dia" class="form-select">
                    <option>Segunda-feira</option>
                    <option>Terça-feira</option>
                    <option>Quarta-feira</option>
                    <option>Quinta-feira</option>
                    <option>Sexta-feira</option>
                    <option>Sábado</option>
                </select>
                </div>
                <div class="form-field">
                <label for="turma-formato">Formato</label>
                <select id="turma-formato" class="form-select">
                    <option>Presencial</option>
                    <option>Híbrida</option>
                    <option>Síncrona</option>
                    <option>Assíncrona</option>
                </select>
                </div>
            </div>
            <div class="form-grid-2">
                <div class="form-field">
                <label for="turma-inicio">Início</label>
                <input id="turma-inicio" class="form-control" type="time" value="19:00">
                </div>
                <div class="form-field">
                <label for="turma-fim">Término</label>
                <input id="turma-fim" class="form-control" type="time" value="21:45">
                </div>
            </div>
            <div class="form-field">
                <label for="turma-sala">Sala ou laboratório</label>
                <select id="turma-sala" class="form-select" required>
                <option value="" selected disabled>Selecione…</option>
                </select>
            </div>
            <div class="form-actions">
                <button class="btn btn-primary" type="submit"><i class="bi bi-plus-lg"></i>Cadastrar turma</button>
            </div>
            </form>
        </div>
        </div>
    </div>
    <div class="cadastro-list-col">
        <div class="d-flex flex-column gap-3">
        <div class="panel">
            <div class="panel-body empty-state">
            <div class="empty-icon"><i class="bi bi-mortarboard"></i></div>
            <p class="empty-title">Nenhuma turma cadastrada</p>
            <p class="empty-desc">Cadastre a primeira turma no formulário ao lado.</p>
            </div>
        </div>
        </div>
    </div>
    </div>
