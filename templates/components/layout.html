<!doctype html>
<html lang="pt-BR" data-bs-theme="light">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Engetec — painel de horários, conversão estática do layout React para Bootstrap 5.">
    <title>Painel · Engetec</title>
    <link rel="icon" type="image/svg+xml" href="static/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet">
    <link href="{{ url_for('static', path='vendor/bootstrap.min.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', path='vendor/bootstrap-icons.min.css') }}" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', path='css/styles.css') }}">
    <link href='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css' rel='stylesheet' />

    <script>
    (function () {
        try {
        var t = localStorage.getItem("engetec-theme");
        if (!t) {
            t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-bs-theme", t);
        } catch (e) {}
    })();
    </script>
    </head>

    <body>
        <div class="app-shell">
            {% include "components/navbar.html" %}
            <div class="app-main">
                <header class="mobile-header"><a class="brand brand-sm" href="/"><span class="brand-mark brand-mark-sm"><i
                        class="bi bi-mortarboard"></i></span><span class="min-w-0">
                    <p class="brand-name">Engetec</p>
                    <p class="brand-sub">Painel de horários</p>
                    </span></a><button type="button" class="theme-toggle" aria-label="Alternar tema"><i
                    class="bi bi-moon-stars"></i></button></header>
                <main class="app-content">
                    {% block content %}
                    {% endblock %}
                </main>
            </div>
        </div>
        <nav class="bottom-nav" aria-label="Navegação principal"><div class="nav-grid"><a class="nav-item active" href="/" aria-current="page"><i class="bi bi-grid-1x2"></i>Painel</a><a class="nav-item" href="semana.html"><i class="bi bi-calendar3"></i>Semana</a><a class="nav-item" href="hoje.html"><i class="bi bi-clock"></i>Hoje</a><a class="nav-item" href="cadastro.html"><i class="bi bi-clipboard-data"></i>Cadastro</a></div></nav>
        <div class="modal fade delete-modal" id="delete-modal" tabindex="-1" aria-labelledby="delete-modal-title" aria-describedby="delete-modal-description" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header align-items-start border-0 pb-0">
                        <span class="delete-modal-icon" aria-hidden="true"><i class="bi bi-trash"></i></span>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                    </div>
                    <div class="modal-body">
                        <h2 class="modal-title fs-4 mb-2" id="delete-modal-title">Solicitar exclusão?</h2>
                        <p class="text-muted-foreground mb-0" id="delete-modal-description">Deseja enviar uma solicitação de exclusão para <strong class="delete-modal-record" data-delete-name></strong>?</p>
                    </div>
                    <div class="modal-footer border-0 pt-0">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal" data-delete-cancel>Cancelar</button>
                        <button type="button" class="btn btn-danger" data-confirm-delete><i class="bi bi-trash" aria-hidden="true"></i> Solicitar exclusão</button>
                    </div>
                </div>
            </div>
        </div>
        {% block modals %}{% endblock %}
        <script src="{{ url_for('static', path='vendor/bootstrap.bundle.min.js') }}"></script>
        <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js'></script>
        <script src='https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.11/locales/pt-br.global.min.js'></script>
        <script type="module" src="{{ url_for('static', path='js/app.js') }}?v=20261111-sala-modules"></script>
        <script src="{{ url_for('static', path='js/calendar.js') }}"></script>

    </body>
</html>
